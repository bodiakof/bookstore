services:
  fastapi:
    build: .
    container_name: bookstore_app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./app:/app/app
      - ./logs:/var/log/fastapi
    env_file:
      - .env

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
